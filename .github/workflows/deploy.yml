name: Deploy to GitHub Pages

# main に push されるたびに、テストしてからビルドして GitHub Pages に公開します。
# 手動実行（Actions タブの "Run workflow"）もできます。
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 依存をインストール
        run: npm ci

      - name: テスト（点数計算・シャンテン数・対局シミュレーション）
        run: npm test

      - name: ビルド（1ファイルにまとめる＝更新直後の真っ白を防ぐ）
        run: npm run build:single

      - name: Pages の設定（未設定なら有効化）
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: ビルド結果をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-single

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
